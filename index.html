<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家計簿</title>
  <link rel="stylesheet" href="style.css">
  <script src="index.js" defer></script>
</head>
<body>
  <header>
    <h1>家計簿</h1>
  </header>

  <main>
    <section class="entry-panel" aria-labelledby="record-heading">
      <h2 id="record-heading">収支を登録</h2>
      <form>
        <p>
          <label for="date">日付</label>
          <input type="date" id="date" name="date" required>
        </p>
        <p>
          <label for="item">品目</label>
          <input type="text" id="item" name="item" required>
        </p>
        <p>
          <label for="type">区分</label>
          <select id="type" name="type" required>
            <option value="expense">支出</option>
            <option value="income">収入</option>
          </select>
        </p>
        <p>
          <label for="amount">金額（円）</label>
          <input type="number" id="amount" name="amount" min="1" step="1" required>
        </p>
        <button type="submit">追加</button>
      </form>
    </section>

    <section class="summary-panel" aria-labelledby="summary-heading">
      <h2 id="summary-heading">合計金額</h2>
      <p>収支合計：<output>0円</output></p>
    </section>

    <section class="records-panel" aria-labelledby="list-heading">
      <h2 id="list-heading">記録一覧</h2>
      <table>
        <thead>
          <tr>
            <th scope="col">日付</th>
            <th scope="col">品目</th>
            <th scope="col">区分</th>
            <th scope="col">金額</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td colspan="4">記録はありません。</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
